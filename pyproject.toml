[project]
name = "coweread"
version = "0.1.0"
description = "微信读书人机共读工具层（读原文/查进度/写批注）—— CLI / REST / MCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.49",
    "httpx>=0.28",
    "python-dotenv>=1.0",
    "mcp[cli]>=1.2,<2",
    "uvicorn>=0.52.4",
]

[project.scripts]
coweread = "coweread.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coweread"]

[tool.pytest.ini_options]
testpaths = ["tests"]
